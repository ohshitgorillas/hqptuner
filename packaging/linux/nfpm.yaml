name: hqptuner
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: sound
maintainer: "oh shit, gorillas! <atom@ohshitgorillas.net>"
description: Web configurator for HQPlayer Embedded
homepage: https://github.com/ohshitgorillas/hqptuner
license: MIT

contents:
  - src: dist/HQPTuner/
    dst: /opt/hqptuner
    type: tree
  - src: packaging/linux/hqptuner.service
    dst: /usr/lib/systemd/system/hqptuner.service

overrides:
  deb:
    depends:
      - debconf (>= 0.5) | debconf-2.0
    scripts:
      postinstall: packaging/linux/deb/postinst
      preremove: packaging/linux/deb/prerm
      postremove: packaging/linux/deb/postrm
  rpm:
    scripts:
      postinstall: packaging/linux/rpm/post
      preremove: packaging/linux/rpm/preun
      postremove: packaging/linux/rpm/postun

deb:
  scripts:
    templates: packaging/linux/deb/templates
