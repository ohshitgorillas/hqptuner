[project]
name = "hqptuner"
version = "0.2.0"
description = "Web configurator for HQPlayer Embedded — backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "beautifulsoup4",
    "defusedxml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "xenon",
    "pre-commit",
    "types-beautifulsoup4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: requires a reachable hqplayerd (deselect with '-m \"not live\"')"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F",      # pycodestyle, pyflakes
    "I",                # isort
    "B",                # bugbear
    "UP",               # pyupgrade
    "SIM",              # simplify
    "RET",              # return discipline
    "ARG",              # unused arguments
    "S",                # bandit security
    "N",                # naming
    "C90",              # mccabe complexity
    "RUF",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # asserts are the point
"scripts/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["hqptuner"]

[[tool.mypy.overrides]]
module = "defusedxml.*"
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hqptuner"]
