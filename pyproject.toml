[project]
name = "hqptuner"
version = "1.6.0"
description = "Web configurator for HQPlayer Embedded — backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "beautifulsoup4",
    "defusedxml",
    "python-multipart",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    "xenon",
    "pre-commit",
    "black",
    "vulture",
    "types-beautifulsoup4",
    "mutmut",
    # the layering contract in [tool.importlinter] below is only enforced if the
    # gate that reads it is installed
    "import-linter",
    # scripts/snap.py drives it for frontend screenshots and geometry
    # measurement, and mypy covers scripts/ — an undeclared playwright reds the
    # gate on any freshly built venv.
    "playwright",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Collect only from tests/. Without this, `make mutate` leaves a full second
# copy of the tree under mutants/ — including mutants/tests/ — and bare pytest
# collects both, which is 38 collection errors from duplicate module basenames,
# not a test failure. mutmut runs pytest with mutants/ as its root, so the same
# relative path is still correct there.
testpaths = ["tests"]
# Fakes and shared fixtures live in tests/support/; tests import them bare
# (`from fake_control import serve`), so both directories go on sys.path.
pythonpath = ["tests", "tests/support"]
markers = [
    "live: requires a reachable hqplayerd (deselect with '-m \"not live\"')",
    "e2e: browser tests driving a real server (deselected by default)",
]

[tool.mutmut]
# Mutation testing, run by hand via `make mutate` — never in `make check` or
# pre-commit (docs/testing.md "Mutation testing"). It asks the one question the
# assertion gate cannot: would this test have failed if the code were wrong.
source_paths = ["hqptuner"]
# The frontend is JavaScript; mutmut mutates Python only and already skips
# non-.py files, but naming static/ keeps the scope explicit rather than
# incidental.
do_not_mutate = ["hqptuner/static/*"]
# Same suite the gate runs: offline and deterministic. A mutation run must never
# reach the production daemon, so the live marker is deselected here too.
pytest_add_cli_args = ["-m", "not live and not e2e", "-x", "-q"]

[tool.vulture]
# Dead-code gate. FastAPI route handlers are invoked via their decorators, not
# called by name, so ignore those decorators or every @router.* endpoint reads
# as unused. min_confidence 60 is vulture's floor for unused module-level defs.
paths = ["hqptuner", "scripts", "tests"]
min_confidence = 60
ignore_decorators = ["@router.get", "@router.post", "@router.put", "@router.delete", "@pytest.fixture"]
# BaseHTTPRequestHandler overrides in the wire-protocol fakes are dispatched by
# http.server via getattr, never called by name; pytest_plugins is read by
# pytest itself. socketserver reads daemon_threads and block_on_close off the
# server class rather than from any call site. All read as unused to a static sweep.
ignore_names = ["do_GET", "do_POST", "log_message", "pytest_plugins", "daemon_threads", "block_on_close"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.ruff.lint]
select = [
    "E", "W", "F",      # pycodestyle, pyflakes
    "I",                # isort
    "B",                # bugbear
    "UP",               # pyupgrade
    "SIM",              # simplify
    "RET",              # return discipline
    "ARG",              # unused arguments
    "S",                # bandit security
    "N",                # naming
    "C90",              # mccabe complexity
    "ERA",              # commented-out code
    "PL",               # pylint
    "SLF",              # private-member access
    "A",                # builtin shadowing
    "C4",               # comprehensions
    "PIE",              # misc redundancy
    "PERF",             # performance anti-patterns
    "FBT",              # boolean-trap arguments
    "TID",              # absolute imports only
    "TC",               # typing-only imports belong in a TYPE_CHECKING block
    "FURB",             # refurb modernizations
    "ISC",              # implicit string concatenation
    "PTH",              # pathlib over os.path
    "DTZ",              # timezone-naive datetime
    "PGH",              # blanket noqa / type-ignore
    "ASYNC",            # async antipatterns: busy-wait loops, timeout parameters
    "BLE",              # blind except: name the exception set or say why not
    "RUF",
    # Docstrings (pydocstyle), pep257 convention, over hqptuner/ and scripts/.
    # tests/ is exempt by decision: docs/testing.md rule 6 already requires a
    # test name to state its behaviour in plain words, so a docstring there
    # restates the name.
    "D",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101", "S106", "S108",  # asserts are the point; hardcoded creds/paths are fake-daemon fixtures, not secrets
    "PLR2004",  # the literal a test asserts against IS the expectation; hoisting it to a constant hides it from the reader
    "PLR0911",  # the wire-protocol fakes dispatch on request path: one return per route
    "PLR0913",  # a behaviour test takes one parameter per input it varies
    "D",        # a test name already states its behaviour; a docstring would restate it
]
"scripts/*" = ["S101"]
"scripts/probes/**/*.py" = ["PLR0915"]  # probes are linear capture sequences, read top to bottom rather than decomposed
"scripts/budget/**/*.py" = [
    "SLF001",   # budget tooling reuses the change-budget hook's own classifiers so its accounting matches the hook's
    "PLR2004",  # the remaining literals are self_checks() expectations: the number asserted IS the expectation
]
"scripts/build_autoeq_db.py" = ["S101", "S603"]  # build-time git invocations with developer-supplied ref, resolved binary

[tool.mypy]
python_version = "3.12"
strict = true
files = ["hqptuner", "tests", "scripts"]
# Mirrors the pytest `pythonpath` above: the support modules and the budget
# analysers are imported by bare name, not by package path.
mypy_path = ["tests", "tests/support", "scripts/budget"]

[[tool.mypy.overrides]]
module = "defusedxml.*"
ignore_missing_imports = true

# Import layering. Highest layer first; a layer may import the layers below it
# and nothing above. Siblings on one line are independent: they may not import
# each other either.
#
# `presets` is not a layer the architecture doc names. The graph puts it between
# core and lanes: core drives it (core/manager.py, core/applyops.py) and it
# drives the lanes (presets/presetlane.py reaching liveoverrides and settle).
#
# `exclude_type_checking_imports` is set because a layers contract constrains
# runtime dependencies, and an `if TYPE_CHECKING:` import is not one — every
# excluded edge here is a lane annotating `mgr: ConnectionManager`, which is the
# manager driving the lane, not the lane depending on the manager. Real edges
# are still caught; this option removes nothing else.
#
# audit.py, config.py and metadata.py are deliberately outside the contract.
# They are top-level modules that import nothing from any hqptuner subpackage,
# so they are leaves of the internal graph and cannot form an upward edge; the
# contract is not `exhaustive`, so unlisted siblings are simply unconstrained.
[tool.importlinter]
root_package = "hqptuner"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
containers = ["hqptuner"]
layers = [
    "api",
    "core",
    "presets",
    "lanes",
    "engine",
    "conf",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hqptuner", "hqptuner.api", "hqptuner.conf", "hqptuner.core", "hqptuner.engine", "hqptuner.lanes", "hqptuner.presets"]

[tool.setuptools.package-data]
# The SPA and its vendored assets, plus the static metadata JSON. Without these
# a wheel install has no frontend to serve and no filter/shaper prose to join
# against the live enumerations. Dev-only members of data/ (engine-enums.json,
# the capture reference) are excluded by the glob.
hqptuner = ["static/**/*", "data/filters.json", "data/shapers.json", "data/settings.json"]
