[project]
name = "hqptuner"
version = "0.8.3"
description = "Web configurator for HQPlayer Embedded — backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "beautifulsoup4",
    "defusedxml",
    "python-multipart",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "xenon",
    "pre-commit",
    "black",
    "vulture",
    "types-beautifulsoup4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: requires a reachable hqplayerd (deselect with '-m \"not live\"')"]

[tool.vulture]
# Dead-code gate. FastAPI route handlers are invoked via their decorators, not
# called by name, so ignore those decorators or every @router.* endpoint reads
# as unused. min_confidence 60 is vulture's floor for unused module-level defs.
paths = ["hqptuner"]
min_confidence = 60
ignore_decorators = ["@router.get", "@router.post", "@router.delete"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.ruff.lint]
select = [
    "E", "W", "F",      # pycodestyle, pyflakes
    "I",                # isort
    "B",                # bugbear
    "UP",               # pyupgrade
    "SIM",              # simplify
    "RET",              # return discipline
    "ARG",              # unused arguments
    "S",                # bandit security
    "N",                # naming
    "C90",              # mccabe complexity
    "RUF",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106", "S108"]  # asserts are the point; hardcoded creds/paths are fake-daemon fixtures, not secrets
"scripts/*" = ["S101"]
"scripts/build_autoeq_db.py" = ["S101", "S603"]  # build-time git invocations with developer-supplied ref, resolved binary

[tool.mypy]
python_version = "3.12"
strict = true
files = ["hqptuner"]

[[tool.mypy.overrides]]
module = "defusedxml.*"
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hqptuner", "hqptuner.api", "hqptuner.conf", "hqptuner.lanes"]

[tool.setuptools.package-data]
# The SPA and its vendored assets, plus the static metadata JSON. Without these
# a wheel install has no frontend to serve and no filter/shaper prose to join
# against the live enumerations. Dev-only members of data/ (engine-enums.json,
# the capture reference) are excluded by the glob.
hqptuner = ["static/**/*", "data/filters.json", "data/shapers.json", "data/settings.json"]
