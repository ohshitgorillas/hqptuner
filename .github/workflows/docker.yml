name: docker

on:
  push:
    branches: [main, beta]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # A red tree must not publish an image. Every tag this workflow pushes —
  # :latest, :beta, and the semver tags — is gated on the same `make check`
  # the pre-commit hooks run locally.
  check:
    uses: ./.github/workflows/check.yml

  build-push:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          # Docker Hub is the documented default; GHCR is kept as a mirror so
          # existing `ghcr.io/...` deployments keep updating. One build, one set
          # of tags, pushed to both.
          images: |
            docker.io/${{ github.repository }}
            ghcr.io/${{ github.repository }}
          # Two release channels on one image repo:
          #   :latest — default branch (main), the stable channel
          #   :beta   — the beta branch, promoted from dev for testers
          # Version tags (v*) publish semver tags on either channel.
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/beta' }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
