name: docker

on:
  push:
    branches: [main, beta]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A red tree must not publish an image. Every tag this workflow pushes —
  # :latest, :beta, and the semver tags — is gated on the same `make check`
  # the pre-commit hooks run locally.
  check:
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read

  # Pushes the image, so it may write packages. A job's permissions replace the
  # workflow's, so contents: read is stated again for the checkout. It holds no
  # signing key: the build runs here, and a key never sits in a job that builds.
  build-push:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # Docker Hub is the documented default; GHCR is kept as a mirror so
          # existing `ghcr.io/...` deployments keep updating. One build, one set
          # of tags, pushed to both.
          images: |
            docker.io/${{ github.repository }}
            ghcr.io/${{ github.repository }}
          # Two release channels on one image repo:
          #   :latest — default branch (main), the stable channel
          #   :beta   — the beta branch, promoted from dev for testers
          # Version tags (v*) publish semver tags on either channel.
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/beta' }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Signs what build-push pushed, by digest, so a moved tag cannot carry the
  # signature to another image. It checks out no code and runs no build step; the
  # key is in the image-signing environment, which only main, beta and v* tags
  # may enter. A signature is a package in the registry, so it needs
  # packages: write; the Docker Hub login is the push for the other registry.
  sign-image:
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: image-signing
    permissions:
      contents: read
      packages: write
    steps:
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Sign the image on both registries
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ needs.build-push.outputs.digest }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no image digest to sign" >&2; exit 1; }
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "docker.io/${REPO}@${DIGEST}" "ghcr.io/${REPO}@${DIGEST}"
