name: check

on:
  # dev only on push: beta, main and v* tags reach this same job through
  # `needs: check` in docker.yml and release.yml, so listing them here would
  # run it once more.
  push:
    branches: [dev]
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Full history, not a shallow clone: the CSS gates enumerate their inputs
      # with `git ls-files`.
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: actions/setup-python@v6
        with:
          # Matches the development host. `requires-python` still admits 3.12+,
          # but only what CI runs is actually known to work.
          python-version: "3.14"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      # The Makefile hardcodes .venv/bin, so CI builds the same venv layout a
      # dev host has rather than reaching for a system interpreter.
      - name: install
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
          npm ci

      - name: lint
        run: make lint lint-js

      # The offline suite only: the pytest line deselects the live-marked and
      # e2e-marked tests. No hqplayerd exists here to serve the live-marked
      # ones, and the e2e job below runs the e2e-marked ones. It is the
      # `pytest-offline` recipe line, so the accepted coverage command runs
      # here and writes .coverage.json.
      - name: pytest (offline)
        run: PYTHONPATH=scripts:scripts/pytest_plugins:$PYTHONPATH .venv/bin/pytest -m "not live and not e2e" -q --cov=hqptuner --cov-branch --cov-report=json:.coverage.json -p idle_probe -p clock_probe -p run_stamp -p suite_deadline --cov-report=term-missing --junitxml=.pytest-junit.xml

      # The gates of `make test` over the reports the step above wrote, without
      # a second suite run (-o skips the pytest-offline recipe). The idle gate
      # counts every delay a shared runner adds, so it runs on the development
      # host only; the clock-wait gate judges real-clock waits here.
      - name: test gates
        run: make -o pytest-offline test IDLE_GATE=off

      - name: python coverage
        run: node .github/cadence/coverage-report-check.mjs --format python --report .coverage.json

      - name: javascript tests and coverage
        run: >-
          node --experimental-test-coverage
          --test-coverage-exclude='tests/**'
          --test-coverage-exclude='**/vendor/**'
          --test-coverage-lines=95
          --test-coverage-branches=90
          --test-coverage-functions=85
          --import ./tests/js/support/vendor-resolve.js
          --test tests/js/*/*.test.js tests/js/*/*/*.test.js tests/js/*/*/*/*.test.js

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: install
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
          npm ci

      # No HQPTUNER_CHROMIUM here: unset, the harness falls back to playwright's
      # own chromium, which is the browser this step installs.
      - name: install chromium
        run: .venv/bin/playwright install --with-deps chromium

      # The e2e tests spawn `python -m hqptuner` plus in-process socket fakes on
      # loopback, so nothing external is needed.
      - name: make test-e2e
        run: make test-e2e
