name: check

on:
  # dev only on push: beta, main and v* tags reach this same job through
  # `needs: check` in docker.yml and release.yml, so listing them here would
  # run it once more.
  push:
    branches: [dev]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history, not a shallow clone: the CSS gates enumerate their inputs
      # with `git ls-files`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          # Matches the development host. `requires-python` still admits 3.12+,
          # but only what CI runs is actually known to work.
          python-version: "3.14"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm

      - run: bash scripts/ci/install-uv.sh "$RUNNER_TEMP/uv"

      # Every package comes from uv.lock, hashes checked, and a lock that is
      # out of date with pyproject.toml fails the step. The Makefile hardcodes
      # .venv/bin, so the sync lands there, as a dev host's venv does. The
      # first sync builds nothing. The project and filepawl build from source
      # in a second sync, with build isolation off, so that their backend is the
      # locked setuptools and not one fetched unhashed. uv may not fetch a
      # Python: setup-python's is the one.
      - name: install
        env:
          UV_PYTHON_DOWNLOADS: never
        run: |
          uv sync --locked --no-build --python 3.14 --extra dev --no-install-project --no-install-package filepawl
          uv sync --locked --python 3.14 --extra dev --no-build-isolation-package hqptuner --no-build-isolation-package filepawl
          npm ci

      # Outside the lock on purpose: it is installed unpinned, so a release of
      # it reaches CI without a lock bump. The make check and pre-commit gates
      # call its console scripts. After the sync, which removes what the lock
      # does not hold.
      - name: install triviajudge
        run: uv pip install --python .venv/bin/python triviajudge

      # The offline half of the suite only: `make check` selects -m "not live",
      # and no hqplayerd exists here to serve the live-marked tests. The idle
      # gate counts every delay a shared runner adds, so it runs on the
      # development host only; the clock-wait gate judges real-clock waits here.
      - name: make check
        run: make check IDLE_GATE=off

      # The accepted coverage policy (.github/cadence/coverage-policy.json): the
      # offline suite measured with branch coverage, then Python held to lines 95
      # and branches 90 over that report, then the JS suite held to the same two.
      # A change that drops either below turns this job red. Each command is the
      # policy's text, so test-policy check finds it here.
      - name: python coverage report
        run: |
          .venv/bin/pytest -m "not live and not e2e" -q --cov=hqptuner --cov-branch --cov-report=json:.coverage.json

      - name: python coverage thresholds
        run: |
          node .github/cadence/coverage-report-check.mjs --format python --report .coverage.json

      - name: js coverage thresholds
        run: |
          node --experimental-test-coverage --test-coverage-exclude='tests/**' --test-coverage-exclude='**/vendor/**' --test-coverage-lines=95 --test-coverage-branches=90 --test-coverage-functions=85 --import ./tests/js/support/vendor-resolve.js --test tests/js/*/*.test.js tests/js/*/*/*.test.js

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm

      - run: bash scripts/ci/install-uv.sh "$RUNNER_TEMP/uv"

      # The same locked sync as the check job; see the comment there.
      - name: install
        env:
          UV_PYTHON_DOWNLOADS: never
        run: |
          uv sync --locked --no-build --python 3.14 --extra dev --no-install-project --no-install-package filepawl
          uv sync --locked --python 3.14 --extra dev --no-build-isolation-package hqptuner --no-build-isolation-package filepawl
          npm ci

      # Unpinned and outside the lock, as in the check job.
      - name: install triviajudge
        run: uv pip install --python .venv/bin/python triviajudge

      # No HQPTUNER_CHROMIUM here: unset, the harness falls back to playwright's
      # own chromium, which is the browser this step installs.
      - name: install chromium
        run: .venv/bin/playwright install --with-deps chromium

      # The e2e tests spawn `python -m hqptuner` plus in-process socket fakes on
      # loopback, so nothing external is needed.
      - name: make test-e2e
        run: make test-e2e
