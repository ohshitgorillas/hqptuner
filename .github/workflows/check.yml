name: check

on:
  # dev only on push: beta, main and v* tags reach this same job through
  # `needs: check` in docker.yml and release.yml, so listing them here would
  # run it once more.
  push:
    branches: [dev]
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history, not a shallow clone: the CSS gates enumerate their inputs
      # with `git ls-files`.
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: actions/setup-python@v6
        with:
          # Matches the development host. `requires-python` still admits 3.12+,
          # but only what CI runs is actually known to work.
          python-version: "3.14"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      # The Makefile hardcodes .venv/bin, so CI builds the same venv layout a
      # dev host has rather than reaching for a system interpreter.
      - name: install
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
          npm ci

      # The offline half of the suite only: `make check` selects -m "not live",
      # and no hqplayerd exists here to serve the live-marked tests. The idle
      # gate counts every delay a shared runner adds, so it runs on the
      # development host only; the clock-wait gate judges real-clock waits here.
      - name: make check
        run: make check IDLE_GATE=off

      # The accepted coverage policy (.github/cadence/coverage-policy.json): the
      # offline suite measured with branch coverage, then Python held to lines 95
      # and branches 90 over that report, then the JS suite held to the same two.
      # A change that drops either below turns this job red. Each command is the
      # policy's text, so test-policy check finds it here.
      - name: python coverage report
        run: |
          .venv/bin/pytest -m "not live and not e2e" -q --cov=hqptuner --cov-branch --cov-report=json:.coverage.json

      - name: python coverage thresholds
        run: |
          node .github/cadence/coverage-report-check.mjs --format python --report .coverage.json

      - name: js coverage thresholds
        run: |
          node --experimental-test-coverage --test-coverage-exclude='tests/**' --test-coverage-exclude='**/vendor/**' --test-coverage-lines=95 --test-coverage-branches=90 --test-coverage-functions=85 --import ./tests/js/support/vendor-resolve.js --test tests/js/*/*.test.js tests/js/*/*/*.test.js

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: install
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
          npm ci

      # No HQPTUNER_CHROMIUM here: unset, the harness falls back to playwright's
      # own chromium, which is the browser this step installs.
      - name: install chromium
        run: .venv/bin/playwright install --with-deps chromium

      # The e2e tests spawn `python -m hqptuner` plus in-process socket fakes on
      # loopback, so nothing external is needed.
      - name: make test-e2e
        run: make test-e2e
