name: check

on:
  # dev only on push: beta, main and v* tags reach this same job through
  # docker.yml's `needs: check`, so listing them here would run it twice.
  push:
    branches: [dev]
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Full history, not a shallow clone: check_file_length.py and the CSS
      # gates enumerate their inputs with `git ls-files`.
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Matches the development host. `requires-python` still admits 3.12+,
          # but only what CI runs is actually known to work.
          python-version: "3.14"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      # The Makefile hardcodes .venv/bin, so CI builds the same venv layout a
      # dev host has rather than reaching for a system interpreter.
      - name: install
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
          npm ci

      # The offline half of the suite only: `make check` selects -m "not live",
      # and no hqplayerd exists here to serve the live-marked tests.
      - name: make check
        run: make check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: install
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
          npm ci

      # No HQPTUNER_CHROMIUM here: unset, the harness falls back to playwright's
      # own chromium, which is the browser this step installs.
      - name: install chromium
        run: .venv/bin/playwright install --with-deps chromium

      # The e2e tests spawn `python -m hqptuner` plus in-process socket fakes on
      # loopback, so nothing external is needed.
      - name: make test-e2e
        run: make test-e2e
