name: check

on:
  # dev only on push: beta, main and v* tags reach this same job through
  # docker.yml's `needs: check`, so listing them here would run it twice.
  push:
    branches: [dev]
  pull_request:
  workflow_call:
  # Weekly on main, the default branch, whose caches every branch and tag can
  # restore: it keeps main's idle record inside GitHub's seven-day eviction and
  # adds a reading to it, so beta and tag runs start from a converged record
  # rather than judging a single sample.
  schedule:
    - cron: "17 6 * * 1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Full history, not a shallow clone: the CSS gates enumerate their inputs
      # with `git ls-files`.
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: actions/setup-python@v6
        with:
          # Matches the development host. `requires-python` still admits 3.12+,
          # but only what CI runs is actually known to work.
          python-version: "3.14"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      # The Makefile hardcodes .venv/bin, so CI builds the same venv layout a
      # dev host has rather than reaching for a system interpreter.
      - name: install
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
          npm ci

      # The idle gate judges each test's smallest recorded idle, a record that
      # converges downward across runs (scripts/gates/check_idle.py). The record
      # is gitignored, so it is carried between runs here: the prefix restores
      # the latest one, and the save below runs whether or not the gate passed,
      # since the gate writes the merged record before it judges. A key is
      # written once, so a rerun of the same run gets its own.
      - uses: actions/cache/restore@v6
        with:
          path: .idle-min.json
          key: idle-min-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: idle-min-

      # The offline half of the suite only: `make check` selects -m "not live",
      # and no hqplayerd exists here to serve the live-marked tests.
      - name: make check
        run: make check

      - uses: actions/cache/save@v6
        if: always()
        with:
          path: .idle-min.json
          key: idle-min-${{ github.run_id }}-${{ github.run_attempt }}

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: install
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
          npm ci

      # No HQPTUNER_CHROMIUM here: unset, the harness falls back to playwright's
      # own chromium, which is the browser this step installs.
      - name: install chromium
        run: .venv/bin/playwright install --with-deps chromium

      # The e2e tests spawn `python -m hqptuner` plus in-process socket fakes on
      # loopback, so nothing external is needed.
      - name: make test-e2e
        run: make test-e2e
