name: release

on:
  push:
    branches: [dev]
    tags: ["v*"]
    paths:
      - "packaging/**"
      - scripts/package-linux.sh
      - scripts/package-macos.sh
      - scripts/package-windows.sh
      - scripts/ci/install-uv.sh
      - hqptuner.spec
      - pyproject.toml
      - uv.lock
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A red tree must not publish a release, so tags are gated on the same
  # `make check` as the image. Pushes to dev skip it.
  tag-check:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/check.yml

  # glibc 2.28 is the floor the packages promise, so the bundle is frozen on
  # AlmaLinux 8 and runs on anything newer.
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            nfpm: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            nfpm: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    container: almalinux:8@sha256:2d0f2eb2a83cc09dbc2eb92fade4dbe8f709628149e81aa00aec70630406603b
    steps:
      - run: dnf -y install git binutils tar gzip

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: true

      - run: bash scripts/ci/install-uv.sh /usr/local/bin
      # Every package comes from uv.lock, hashes checked, and a lock out of date
      # with pyproject.toml fails the step: the runtime dependencies and
      # PyInstaller, not the dev extras. The first sync builds nothing, so a
      # package with no wheel for this target fails it. The project builds in a
      # second sync with build isolation off, so its backend is the locked
      # setuptools and not one fetched unhashed.
      - run: uv sync --locked --no-build --python 3.14 --group build --no-install-project
      - run: uv sync --locked --python 3.14 --group build --no-editable --no-build-isolation-package hqptuner

      - name: Install nfpm
        env:
          NFPM_VERSION: 2.47.0
        run: |
          tarball="nfpm_${NFPM_VERSION}_Linux_${{ matrix.nfpm }}.tar.gz"
          base="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}"
          curl -LsSfO "$base/$tarball"
          curl -LsSfO "$base/checksums.txt"
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" -C /usr/local/bin nfpm

      - run: scripts/package-linux.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  # Install, run and remove in a container with no systemd, on the oldest
  # supported release of each family and the newest Fedora.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
        distro:
          - { image: "debian:12", ext: deb }
          - { image: "ubuntu:22.04", ext: deb }
          - { image: "almalinux:8", ext: rpm }
          - { image: "fedora:latest", ext: rpm }
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 5
    container: ${{ matrix.distro.image }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-${{ matrix.platform.arch }}
          path: dist

      - name: Install curl
        run: |
          if command -v curl >/dev/null; then
            exit 0
          fi
          if [ "${{ matrix.distro.ext }}" = deb ]; then
            apt-get update
            apt-get install -y curl
          else
            dnf -y install curl
          fi

      - run: bash packaging/linux/smoke.sh dist/*.${{ matrix.distro.ext }}

  # The runner VM boots systemd, so the deb lifecycle runs on it directly.
  lifecycle-deb:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: dist

      - name: Start the daemon stand-in
        run: |
          nohup python3 scripts/ci/daemon_standin.py 127.0.0.1 8088 > "$RUNNER_TEMP/standin.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/standin.pid"
          for _ in $(seq 30); do
            curl -s -o /dev/null --max-time 1 http://127.0.0.1:8088/ && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/standin.log"
          exit 1

      - run: sudo GITHUB_ACTIONS=true bash packaging/linux/lifecycle.sh dist/*.deb

      - name: Stop the daemon stand-in
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/standin.pid")"

  # The rpm lifecycle needs systemd as PID 1 in an rpm distro, which a
  # `container:` job cannot give, so it boots one with docker.
  lifecycle-rpm:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: dist

      - name: Start the daemon stand-in
        run: |
          nohup python3 scripts/ci/daemon_standin.py 127.0.0.1 8088 > "$RUNNER_TEMP/standin.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/standin.pid"
          for _ in $(seq 30); do
            curl -s -o /dev/null --max-time 1 http://127.0.0.1:8088/ && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/standin.log"
          exit 1

      # The host network lets the app inside dial 127.0.0.1:8088 and reach the stand-in on the runner.
      - name: Start AlmaLinux 8 with systemd
        run: |
          docker run -d --name alma --privileged --cgroupns=host --network host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw almalinux/8-init
          rpm=(dist/*.rpm)
          docker cp "${rpm[0]}" alma:/tmp/hqptuner.rpm
          docker cp packaging/linux/lifecycle.sh alma:/tmp/lifecycle.sh
          docker exec alma systemctl is-system-running --wait || true

      - run: docker exec -e GITHUB_ACTIONS=true alma bash /tmp/lifecycle.sh /tmp/hqptuner.rpm

      - if: always()
        run: docker rm -f alma

      - name: Stop the daemon stand-in
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/standin.pid")"

  # PyInstaller does not cross-compile, so each architecture freezes on its own
  # runner. This job holds no credential: it runs the build, and the unsigned app
  # goes to sign-macos in an archive, because an uploaded artifact loses the file
  # modes and symlinks a frozen app depends on. The name must stay clear of
  # macos-*, which is what publish attaches to the release.
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: true

      - run: bash scripts/ci/install-uv.sh "$RUNNER_TEMP/uv"
      # Locked, as in the build job.
      - run: uv sync --locked --no-build --python 3.14 --group build --no-install-project
      - run: uv sync --locked --python 3.14 --group build --no-editable --no-build-isolation-package hqptuner

      - run: scripts/package-macos.sh freeze

      - run: ditto -c -k --keepParent dist/HQPTuner.app "$RUNNER_TEMP/unsigned-app.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-app-${{ matrix.arch }}
          path: ${{ runner.temp }}/unsigned-app.zip
          if-no-files-found: error

  # The one job that signs the macOS app, in the environment that holds the
  # certificate and the notary key. It runs the sign stage of the packaging
  # script and nothing the build installed: no submodules, no Python packages.
  # The dmgs are signed with the Developer ID certificate and notarized, and
  # publish attaches them to the release.
  sign-macos:
    needs: build-macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    environment: signing
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-app-${{ matrix.arch }}
          path: ${{ runner.temp }}/unsigned

      - run: ditto -x -k "$RUNNER_TEMP/unsigned/unsigned-app.zip" dist

      # The certificate goes into a keychain of its own, and codesign takes the
      # identity by the hash read back from it.
      - name: Import the signing certificate and the notary key
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          echo -n "$MACOS_CERT_P12_BASE64" | base64 --decode -o "$RUNNER_TEMP/certificate.p12"
          echo -n "$NOTARY_KEY_P8_BASE64" | base64 --decode -o "$RUNNER_TEMP/notary.p8"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychain -d user -s "$keychain"
          identity=$(security find-identity -v -p codesigning "$keychain" | grep -o -m1 '[0-9A-F]\{40\}' || true)
          if [ -z "$identity" ]; then
            echo "No valid signing identity in the imported certificate" >&2
            exit 1
          fi
          echo "HQPTUNER_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "HQPTUNER_NOTARY_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - run: scripts/package-macos.sh sign
        env:
          HQPTUNER_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          HQPTUNER_NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}

      - name: Remove the signing certificate and the notary key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/notary.p8"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  # Each dmg runs on the macOS it was built on and on every newer one a runner
  # offers. The xcode-27 image is the one that runs macOS 27.
  smoke-macos:
    needs: sign-macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-26
            arch: arm64
          - runner: xcode-27
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-${{ matrix.arch }}
          path: dist

      - run: bash packaging/macos/smoke.sh dist/*.dmg --notarized

  # Each architecture freezes on its own runner, with a Python of that
  # architecture named outright: uv may otherwise pick an x64 one on Arm64.
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
            python: cpython-3.14-windows-x86_64-none
          - runner: windows-11-arm
            arch: arm64
            python: cpython-3.14-windows-aarch64-none
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: true

      - run: bash scripts/ci/install-uv.sh "$RUNNER_TEMP/uv" ${{ matrix.arch }}
      # Locked, as in the build job.
      - run: uv sync --locked --no-build --python ${{ matrix.python }} --group build --no-install-project
      - run: uv sync --locked --python ${{ matrix.python }} --group build --no-editable --no-build-isolation-package hqptuner

      - run: scripts/package-windows.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-bundle-${{ matrix.arch }}
          path: dist/windows
          if-no-files-found: error

  # One installer carries both bundles. Both executables, the installer and its
  # uninstaller are signed here, the one job that reads the SimplySign login,
  # with the certificate named by the thumbprint the login step exports.
  package-windows:
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 10
    environment: signing
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: windows-bundle-*
          path: dist/windows
          merge-multiple: true

      - name: Log in to SimplySign
        shell: pwsh
        env:
          SIMPLYSIGN_EMAIL: ${{ secrets.SIMPLYSIGN_EMAIL }}
          SIMPLYSIGN_OTPAUTH_URI: ${{ secrets.SIMPLYSIGN_OTPAUTH_URI }}
        run: ./packaging/windows/simplysign-login.ps1

      - run: scripts/package-windows.sh installer

      - name: Log out of SimplySign
        if: always()
        shell: pwsh
        run: Get-Process -Name 'SimplySignDesktop*' -ErrorAction SilentlyContinue | Stop-Process -Force

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: dist/*-setup.exe
          if-no-files-found: error

  # The installer picks the bundle of the machine it runs on, so each runner
  # exercises its own. The x64 bundle also runs on Arm64, under emulation, and
  # is the copy build-windows uploaded, which no job signs.
  smoke-windows:
    needs: package-windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            artifact: windows-installer
            target: dist/*-setup.exe
            arch: x64
            signed: --signed
            previous: --previous previous/setup.exe
          - runner: windows-11-arm
            artifact: windows-installer
            target: dist/*-setup.exe
            arch: arm64
            signed: --signed
            previous: --previous previous/setup.exe
          - runner: windows-11-arm
            artifact: windows-bundle-x64
            target: dist/x64/HQPTuner
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      PREVIOUS_VERSION: "1.20.1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist

      # The installer rows upgrade over this published release. It goes outside
      # dist/, because the target glob there must match one installer.
      - if: matrix.previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir previous
          gh release download "v$PREVIOUS_VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern "HQPTuner-$PREVIOUS_VERSION-setup.exe" --output previous/setup.exe

      - run: bash packaging/windows/smoke.sh ${{ matrix.target }} ${{ matrix.arch }} ${{ matrix.signed }} ${{ matrix.previous }}

  # The release notes are that version's CHANGELOG.md section, verbatim.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tag-check, build, smoke, lifecycle-deb, lifecycle-rpm, sign-macos, smoke-macos, package-windows, smoke-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-installer
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: macos-*
          path: dist
          merge-multiple: true

      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v h="## [$version]" '
            index($0, "## [") == 1 { if (found) exit; if (index($0, h) == 1) { found = 1; next } }
            found
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "No CHANGELOG.md section for $version" >&2
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md dist/*.deb dist/*.rpm dist/*.dmg dist/*-setup.exe
