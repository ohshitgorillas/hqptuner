<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HQPTuner Faceplate</title>
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira+Extra+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../hqptuner/static/css/v2/tokens.css">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="../hqptuner/static/css/v2/base.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="../hqptuner/static/css/v2/primitives.css">
<link rel="stylesheet" href="../hqptuner/static/css/v2/header.css">
<link rel="stylesheet" href="../hqptuner/static/css/v2/rail.css">
<link rel="stylesheet" href="../hqptuner/static/css/v2/page.css">
<link rel="stylesheet" href="../hqptuner/static/css/v2/switcher.css">
<link rel="stylesheet" href="../hqptuner/static/css/v2/builder.css">
<link rel="stylesheet" href="../hqptuner/static/css/v2/popovers.css">
<link rel="stylesheet" href="../hqptuner/static/css/v2/drawer.css">
<link rel="stylesheet" href="../hqptuner/static/css/v2/meter.css">
<link rel="stylesheet" href="../hqptuner/static/css/v2/matrix.css">
<link rel="stylesheet" href="../hqptuner/static/css/v2/settings.css">
<link rel="stylesheet" href="../hqptuner/static/css/v2/sheets.css">
<link rel="stylesheet" href="styles/builder.css">

<!--
  HQPTuner v2 faceplate mockup. Static regions live here; everything list-shaped (rail stages, station tree,
  presets, narrow-filter facets, stage drawers) is rendered by scripts/ from scripts/data/.
  Mock state: volume active (−12.5 dB), matrix on, crossfeed off (Speakers station), loudness on, HF off, DAC correction off, SDM output.
-->
<!-- Mock strip: Scenario (what is playing), Alerts, Display size (10.2″ | 11″ | 13″ iPad, lib/plate.js). Viewing tools for the
     mockup, outside the plate. components/scenario.js. -->
<div class="scene" id="scene" role="group" aria-label="Mock scenario"></div>
<div id="stage">
<div class="plate" id="plate">

  <header class="hdr">
    <!-- Brand knob = connection lamp (v1's knob glyph back, combined with the Connected pill). Its ring
         is the light: green connected, amber applying (pointer sweeps), red unreachable (pointer turned to off).
         Tap → connection settings (v1 StatusPill; panel not drawn). components/conn.js. -->
    <button class="conn" id="conn" type="button" data-state="ok"><svg viewBox="0 0 32 32" aria-hidden="true"><circle class="ring" cx="16" cy="16" r="11.5"/><line class="ptr" x1="16" y1="16" x2="16" y2="7"/><circle class="hub" cx="16" cy="16" r="1.6"/></svg></button>
    <div class="mark">HQPTUNER</div><span class="mono ver">v2.0.0</span>
    <div class="station" id="station-host"><span class="eng">Station · Snapshot</span></div>
    <button class="btn hb" id="stbbtn" type="button">Station builder</button>
    <button class="btn hb" id="sbbtn" type="button">Snapshot builder</button>
    <button class="round gear" id="gear" type="button" aria-label="Settings"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>
  <div class="rule"></div>

  <!-- Engine row: process speed, buffers, event counters. All values are live readouts. -->
  <div class="engine">
    <div class="gauge">
      <svg viewBox="0 0 110 60" width="62" height="34" aria-label="Process speed gauge" role="img">
        <path class="trk" d="M10 54 A45 45 0 0 1 100 54" fill="none" stroke-width="6"/>
        <path class="z-bad" d="M10 54 A45 45 0 0 1 32 17" fill="none" stroke-width="6"/>
        <path class="z-warn" d="M32 17 A45 45 0 0 1 42 12" fill="none" stroke-width="6"/>
        <path class="z-ok" d="M42 12 A45 45 0 0 1 100 54" fill="none" stroke-width="6"/>
        <line class="ndl" x1="55" y1="54" x2="80" y2="18" stroke-width="2.5" stroke-linecap="round"/>
        <circle class="hub" cx="55" cy="54" r="4"/>
      </svg>
      <div class="readout"><span class="mono val">1.62×</span><span class="cnt">process speed</span></div>
    </div>
    <div class="meters">
      <div class="meter"><span class="ml">Input buffer</span><span class="bar"><span class="fill" style="width:82%"></span></span><span class="mv">82%</span></div>
      <div class="meter"><span class="ml">Output buffer</span><span class="bar"><span class="fill" style="width:74%"></span></span><span class="mv">74%</span></div>
    </div>
    <div class="counter"><span class="lamp big"></span><span class="eng">Clipping</span><span class="cnts"><span class="cnt">0 this track</span><span class="cnt">3 total</span></span></div>
    <div class="counter"><span class="lamp big bad"></span><span class="eng">Apodizing</span><span class="cnts"><span class="cnt">12 this track</span><span class="cnt">5,410 total</span></span></div>
    <!-- Playback volume: the one live control in this row (amp-faceplate position, right end). Readout opens the slider popover. -->
    <div class="volc" role="group" aria-label="Playback volume">
      <button class="round vbtn" type="button" id="vol-dn" aria-label="Volume down">−</button>
      <button class="vfd volrd" type="button" id="vol-rd" aria-haspopup="dialog" aria-controls="vpop"><span class="l">Volume</span><span class="v">−12.5 dB</span></button>
      <button class="round vbtn" type="button" id="vol-up" aria-label="Volume up">+</button>
    </div>
  </div>
  <div class="rule"></div>

  <div class="body" id="body">

    <nav class="rail" id="rail" aria-label="Signal chain">
      <svg class="wire" aria-hidden="true"><path/></svg>
      <!-- stages rendered here by rail.js -->
    </nav>
    <div class="vrule"></div>

    <!-- Page: engaged stages only, fixed spacing between sections; one .fill section takes the spare height. Split rationale: Resampling = filters; Shaping = modulator/dither (noise shaping). -->
    <main class="page">

      <!-- One section per engaged stage, in signal order. HF filter is off in this state, so it has no section.
           Volume has no section: its live control sits at the right end of the engine row. -->
      <!-- Source: the meter (spectrum + levels), only while the Matrix section is gone; full at 13″, slim at 10.2″ / 11″
           (lib/plate.js SIZES meter). Source is always engaged and first in signal order. It takes the fill then.
           main.js paintPageMeter(); components/source-meter.js compact. -->
      <section class="sec fill psrc" aria-label="Source" hidden>
        <div class="sh"><span class="t">Source</span><span class="ln"></span></div>
        <div class="pmeter" id="pmeter"></div>
      </section>

      <section class="sec fill" aria-label="Matrix profile">
        <div class="sh"><span class="t">Matrix profile</span><span class="ln"></span></div>
        <div class="two stretch">
          <div class="stack mstack">
            <div class="inline">
              <select class="vfd" id="mprof" aria-label="Matrix profile"><option>[Default]</option></select>
              <button class="btn" type="button" id="pbbtn">Profile builder</button>
            </div>
            <!-- Profile description: user text, edited in place; fills the column down to the plot's bottom edge. Mock value. -->
            <label class="desc">
              <textarea id="mdesc" aria-label="Matrix profile description" spellcheck="false" maxlength="500">Living room mains · REW correction measured at the listening chair.
Crossfeed off for speakers; loudness on for late-night listening.</textarea>
              <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M10.5 2.5l3 3-8 8H2.5v-3z"/><path d="M9 4l3 3"/></svg>
            </label>
          </div>
          <!-- Matrix response: drawn by components/matrix-plot.js from data/matrix.js, 1:1 at whatever height the section gets. -->
          <div class="eq" id="mplot"></div>
        </div>
      </section>

      <!-- Resampling and Shaping: one section each, as on the rail (one stage, one drawer, one section). Resampling's header
           carries Filter presets (popover). Narrowing shows only in the filter list, where it lives. -->
      <section class="sec" aria-label="Resampling">
        <div class="sh"><span class="t">Resampling</span><span class="ln"></span>
          <button class="btn" type="button" id="fpbtn" aria-haspopup="dialog" aria-controls="fpop">Filter presets</button>
        </div>
        <!-- 1x filter + Nx fold: rendered by components/conversion.js from data/conversion.js. -->
        <div id="rs-body"></div>
      </section>

      <!-- Shaping: dither (PCM out) or sigma-delta modulator (SDM out). conversion.js. -->
      <section class="sec" aria-label="Shaping">
        <div class="sh"><span class="t">Shaping</span><span class="ln"></span></div>
        <div id="sh-body"></div>
      </section>

      <!-- Output: only while Settings → Behavior → Allow pinned rates is On (pins off, the stage has no page job: the rail
           shows the format, the Output drawer sets it). Rate picker (components/output-tuner.js): Auto + the running band's
           exact rates as pins. No mode control here: output mode is the Setting Switcher's (Output mode target) and the station's. -->
      <section class="sec" aria-label="Output" hidden>
        <div class="sh"><span class="t">Output</span><span class="ln"></span></div>
        <div id="oglass"></div>
      </section>

    </main>
    <!-- stage drawers appended here by drawer.js -->
  </div>

  <!-- Settings: the gear swaps the chain body for this one (components/settings.js). Same grid: rail | hairline | page;
       rail = categories (no wire, no lamps), page = About, drawers over the page. -->
  <div class="body setbody" id="sbody" hidden>
    <nav class="rail srail" id="srail" aria-label="Settings"></nav>
    <div class="vrule"></div>
    <main class="page spage" id="spage"></main>
  </div>

  <!-- Snapshot builder: the header's Snapshot builder button swaps the chain body for this one, as the gear does for
       Settings (components/snapshot-builder.js). Rail = the active station's snapshots + New snapshot; page = the one being
       edited, one row per setting a snapshot can hold, in chain order. -->
  <div class="body bldbody" id="bbody" hidden>
    <nav class="rail brail" id="brail" aria-label="Snapshots"></nav>
    <div class="vrule"></div>
    <main class="page bpage" id="bpage" aria-label="Snapshot"></main>
  </div>

  <!-- Profile builder: the Matrix engine section's Profile builder button swaps the chain body for this one
       (components/profile-builder.js). Rail = flat list: Profile (home), then the questions a profile answers (EQ / Correction,
       Crossfeed, DAC correction, Loudness), DSP pipelines, Advanced settings; entries open drawers over this body. -->
  <div class="body bldbody pbbody" id="pbody" hidden>
    <nav class="rail prail" id="prail" aria-label="Matrix profile"></nav>
    <div class="vrule"></div>
    <main class="page bpage pbpage" id="ppage" aria-label="Matrix profile"></main>
  </div>

  <!-- Station builder: the header's Station builder button swaps the chain body for this one (components/station-builder.js).
       The setup wizard's station walk: rail = Overview + the steps with their answers; page = the overview or one step. -->
  <div class="body bldbody pbbody stbbody" id="stbody" hidden>
    <nav class="rail prail strail" id="strail" aria-label="Station"></nav>
    <div class="vrule"></div>
    <main class="page bpage pbpage stbpage" id="stpage" aria-label="Station"></main>
  </div>

  <div class="rule botrule"></div>
  <!-- Bottom bar = Visual settings → Bottom bar: Setting Switcher (default) | None (data-bottom on the plate, settings.js).
       The Setting Switcher's Volume target swaps its slots for the volume bar (.vbar, moved in by main.js; plate data-sw);
       the engine-row volume hides meanwhile. -->
  <div class="vbar" id="vbar" role="group" aria-label="Playback volume"></div>
  <!-- Setting Switcher: pick a target (dropdown); the two slots ARE the switch (no A/B keys).
       Tap a slot's body → it goes live (radio). Tap its ▾ end → its list sheet, any time, live or not. Wired by switcher.js. -->
  <div class="switcher">
    <div class="target">
      <span class="eng">Setting Switcher</span>
      <select class="vfd" id="swtarget" aria-label="Setting to switch">
        <option>1x filter</option><option>Nx filter</option><option selected>Modulator</option><option>Matrix profile</option><option>Output mode</option><option>Volume</option>
      </select>
    </div>
    <div class="slots" role="radiogroup" aria-label="Live setting">
      <div class="slot on">
        <button class="sbody" type="button" role="radio" aria-checked="true"><span class="tx"><span class="l">AMSDM7EC 512+fs</span><span class="v">Adaptive · 7th order · Pseudo-multi-bit, EC, DSD512+</span></span></button>
        <button class="spick" type="button" aria-haspopup="dialog" aria-label="Choose the first setting">▾</button>
      </div>
      <div class="slot">
        <button class="sbody" type="button" role="radio" aria-checked="false"><span class="tx"><span class="l">ASDM7EC-fast 512+fs</span><span class="v">Adaptive · 7th order · Transient optimized, EC, DSD512+</span></span></button>
        <button class="spick" type="button" aria-haspopup="dialog" aria-label="Choose the second setting">▾</button>
      </div>
    </div>
  </div>

  <!-- plate-level popovers (presets, volume, notes) and bottom sheets (option list, narrow filters) appended here -->
</div>
</div>

<script type="module" src="scripts/main.js"></script>

</body></html>
