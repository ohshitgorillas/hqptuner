repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/ruff check
        language: system
        types: [python]
      - id: black
        name: black
        entry: .venv/bin/black
        language: system
        types: [python]
      - id: xenon
        name: xenon complexity gate
        entry: .venv/bin/xenon --max-absolute B --max-average A --max-modules A hqptuner
        language: system
        pass_filenames: false
        types: [python]
      - id: vulture
        name: vulture dead-code gate
        entry: .venv/bin/vulture
        language: system
        pass_filenames: false
        types: [python]
      - id: mypy
        name: mypy (strict)
        entry: .venv/bin/mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: file-length
        name: max 500 lines per source file
        entry: .venv/bin/python scripts/check_file_length.py
        language: system
        types: [python]
      - id: single-assertion
        name: one assertion per test
        entry: .venv/bin/python scripts/check_test_assertions.py
        language: system
        types: [python]
        files: ^tests/
      - id: pytest-offline
        name: pytest (offline suite)
        entry: .venv/bin/pytest -m "not live" -q
        language: system
        pass_filenames: false
        always_run: true

      # --- frontend gates, mirroring the Python ones above ---
      # The JS test suite is deliberately NOT here: it lives in `make check`
      # only, to keep the commit path from carrying two full suites.
      - id: eslint
        name: eslint
        entry: npx eslint
        language: system
        types: [javascript]
        exclude: ^hqptuner/static/vendor/
      - id: prettier
        name: prettier
        entry: npx prettier --write
        language: system
        files: \.(js|json)$
        exclude: ^(hqptuner/static/vendor/|package-lock\.json$)
      - id: tsc
        name: tsc (checkJs)
        entry: npx tsc -p jsconfig.json
        language: system
        pass_filenames: false
        types: [javascript]
      - id: knip
        name: knip dead-export gate
        entry: npx knip
        language: system
        pass_filenames: false
        types: [javascript]
      - id: file-length-js
        name: max 500 lines per source file (js)
        entry: .venv/bin/python scripts/check_file_length.py
        language: system
        types: [javascript]
        exclude: ^(hqptuner/static/vendor/|hqptuner/static/store/schema\.js$)

      - id: css-tokens
        name: css design-token gate
        entry: .venv/bin/python scripts/check_css_tokens.py
        language: system
        files: ^hqptuner/static/css/.*\.css$
