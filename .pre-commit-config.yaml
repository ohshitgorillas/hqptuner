repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/ruff check
        language: system
        types: [python]
      - id: black
        name: black
        entry: .venv/bin/black
        language: system
        types: [python]
      - id: xenon
        name: xenon complexity gate
        entry: .venv/bin/xenon --max-absolute B --max-average A --max-modules A hqptuner
        language: system
        pass_filenames: false
        types: [python]
      - id: vulture
        name: vulture dead-code gate
        entry: .venv/bin/vulture
        language: system
        pass_filenames: false
        types: [python]
      - id: mypy
        name: mypy (strict)
        entry: .venv/bin/mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: import-linter
        name: import layering gate
        entry: .venv/bin/lint-imports
        language: system
        pass_filenames: false
        types: [python]
      - id: file-length
        name: max 500 source / 800 test lines, watched files only shrink
        entry: .venv/bin/python scripts/gates/check_file_length.py
        language: system
        types: [python]
      - id: no-barrels
        name: no re-export modules or trivial forwarders
        entry: .venv/bin/python scripts/gates/check_no_barrels.py
        language: system
        types: [python]
        exclude: ^tests/
      - id: changelog-style
        name: changelog entry style ([Unreleased] only)
        entry: .venv/bin/python scripts/gates/check_changelog.py
        language: system
        files: ^CHANGELOG\.md$
      - id: single-assertion
        name: one assertion per test
        entry: .venv/bin/python scripts/gates/check_test_assertions.py
        language: system
        types: [python]
        files: ^tests/
      - id: pytest-offline
        name: pytest (offline suite)
        entry: .venv/bin/pytest -m "not live and not e2e" -q --cov=hqptuner --cov-branch --cov-report=term-missing --cov-report=json:.coverage.json
        language: system
        pass_filenames: false
        always_run: true

      # Reads the report the hook above writes, so it runs after it. No
      # fail_fast here, so it also runs when that hook reds — hence the gate
      # refusing a missing report rather than passing.
      - id: coverage-floor
        name: per-file coverage floor
        entry: .venv/bin/python scripts/gates/check_coverage_floor.py
        language: system
        pass_filenames: false
        always_run: true

      # --- frontend gates, mirroring the Python ones above ---
      # The JS test suite is deliberately NOT here: it lives in `make check`
      # only, to keep the commit path from carrying two full suites.
      - id: eslint
        name: eslint
        entry: npx eslint
        language: system
        types: [javascript]
        exclude: ^hqptuner/static/vendor/
      - id: prettier
        name: prettier
        entry: npx prettier --write
        language: system
        files: \.(js|json)$
        exclude: ^(hqptuner/static/vendor/|package-lock\.json$)
      - id: tsc
        name: tsc (checkJs)
        entry: npx tsc -p jsconfig.json
        language: system
        pass_filenames: false
        types: [javascript]
      - id: tsc-node
        name: tsc (checkJs, node trees)
        entry: npx tsc -p tsconfig.node.json
        language: system
        pass_filenames: false
        types: [javascript]
      - id: knip
        name: knip dead-export gate
        entry: npx knip
        language: system
        pass_filenames: false
        types: [javascript]
      - id: file-length-js
        name: max 500 source / 800 test lines (js)
        entry: .venv/bin/python scripts/gates/check_file_length.py
        language: system
        types: [javascript]
        exclude: ^(hqptuner/static/vendor/|hqptuner/static/store/schema\.js$)

      - id: css-tokens
        name: css design-token gate
        entry: .venv/bin/python scripts/gates/check_css_tokens.py
        language: system
        files: ^hqptuner/static/css/.*\.css$

      - id: css-cards
        name: css one-card-component gate
        entry: .venv/bin/python scripts/gates/check_css_cards.py
        language: system
        files: ^hqptuner/static/css/.*\.css$

      # Cross-cutting: a class is a string on the JS side and a selector on the
      # CSS side, so the gate has to run when EITHER side moves.
      - id: css-classes
        name: css orphaned-class gate
        entry: .venv/bin/python scripts/gates/check_css_classes.py
        language: system
        pass_filenames: false
        files: ^hqptuner/static/(css/.*\.css|.*\.js)$
        exclude: ^hqptuner/static/vendor/

      # Cross-cutting: a custom property is declared in CSS and may be read from
      # either side — theme.js writes --accent through setProperty and
      # controls/index.js reads var(--accent) out of a string — so the gate has
      # to run when EITHER side moves.
      - id: css-dead
        name: css dead-property/keyframe gate
        entry: .venv/bin/python scripts/gates/check_css_dead.py
        language: system
        pass_filenames: false
        files: ^hqptuner/static/(css/.*\.css|.*\.js)$
        exclude: ^hqptuner/static/vendor/

      # Cross-cutting: the widget kinds live in schema.js and their staged-edit
      # marking lives in the stylesheets, so the gate has to run when either moves.
      - id: css-dirty
        name: staged-edit marking gate
        entry: .venv/bin/python scripts/gates/check_css_dirty.py
        language: system
        pass_filenames: false
        files: ^hqptuner/static/(css/.*\.css|store/schema\.js)$

      # Cross-cutting: a clone has two ends and either one can move, and the
      # threshold is a whole-tree percentage, so the gate reads the entire
      # source set from .jscpd.json rather than the staged filenames.
      - id: jscpd
        name: copy-paste duplication gate
        entry: npx jscpd
        language: system
        pass_filenames: false
        files: ^(hqptuner|scripts|tests)/.*\.(py|js|css)$
        exclude: ^hqptuner/static/vendor/

      # Cross-cutting: one control is spelled out in schema.js, presetconf.py and
      # settings.json, so the gate has to run when ANY of the three moves.
      - id: control-catalog
        name: control catalog cross-check
        entry: .venv/bin/python scripts/gates/check_control_catalog.py
        language: system
        pass_filenames: false
        files: ^(hqptuner/static/store/schema\.js|hqptuner/conf/presetconf\.py|hqptuner/data/settings\.json)$

      # Cross-cutting: a citation names a doc heading, so the gate has to run
      # when either the citing source or the cited doc moves.
      - id: doc-refs
        name: doc citation gate
        entry: .venv/bin/python scripts/gates/check_doc_refs.py
        language: system
        types_or: [python, javascript, markdown]
        exclude: ^hqptuner/static/vendor/

      - id: archaeology
        name: decision-archaeology gate
        entry: .venv/bin/python scripts/gates/check_archaeology.py
        language: system
        types_or: [python, javascript, css]
        exclude: ^(hqptuner/static/vendor/|tests/|scripts/probes/)

      # Wiring drifts when either config moves, and neither is a source file any
      # types: selector matches, so this one always runs.
      - id: gates-wired
        name: gate wiring gate
        entry: .venv/bin/python scripts/gates/check_gates_wired.py
        language: system
        pass_filenames: false
        always_run: true

      # Both drive the real modules through node and read the whole lib dir, so
      # they take no filenames and trigger on any lib JS.
      - id: binaural
        name: binaural crossfeed reference check
        entry: .venv/bin/python scripts/gates/check_binaural.py
        language: system
        pass_filenames: false
        files: ^hqptuner/static/lib/.*\.js$

      - id: xfeed
        name: crossfeed EQ-handling regression gate
        entry: .venv/bin/python scripts/gates/check_xfeed.py
        language: system
        pass_filenames: false
        files: ^hqptuner/static/lib/.*\.js$

      # Reads the config module and the e2e harness together, so it triggers on
      # either: a new path knob and a harness that forgot it are the same defect
      # seen from two files.
      - id: e2e-isolation
        name: e2e state-isolation gate
        entry: .venv/bin/python scripts/gates/check_e2e_isolation.py
        language: system
        pass_filenames: false
        files: ^(hqptuner/config\.py|tests/e2e/support/stack\.py)$
