# HQPTuner — compose deployment.
#
# Default assumes hqplayerd runs on the SAME machine (bare metal): standard
# bridge networking, daemon reached via the Docker host gateway. HQPTuner finds
# it there on first start. A daemon on another machine is named in the
# Connection panel, along with the management username and password.
#
# What the panel saves lives in ./state/connection.json. The three variables
# below outrank it, so set one only to pin that field.
#
# State: ./state holds config backups and the preset store. Create it before
# first start (`mkdir -p state`) so it's owned by you, not root — the container
# runs as uid 1000.

services:
  hqptuner:
    image: ohshitgorillas/hqptuner:latest
    container_name: hqptuner
    restart: unless-stopped

    ports:
      - "8090:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      # Passed through only where the variable is actually set, in the shell or
      # in an env file beside this one. Unset means the Connection panel governs.
      - HQPTUNER_HQP_HOST
      - HQPTUNER_HQP_USERNAME
      - HQPTUNER_HQP_PASSWORD
      # - HQPTUNER_LISTEN_PORT=8090
      # - HQPTUNER_HQP_HOME=/var/lib/hqplayer/home

    volumes:
      - ./state:/state
