<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HQPTuner</title>
    <!-- default slider glyph; store/favicon.js swaps it per the active preset -->
    <link id="favicon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%9A%EF%B8%8F%3C/text%3E%3C/svg%3E" />
    <!-- CSS is split by concern; THIS ORDER IS THE CASCADE ORDER. It is the
         source order of the former single app.css and must not be reordered. -->
    <link rel="stylesheet" href="/css/base/tokens.css" />
    <link rel="stylesheet" href="/css/base/marks.css" />
    <link rel="stylesheet" href="/css/base/header.css" />
    <link rel="stylesheet" href="/css/base/signal-path.css" />
    <link rel="stylesheet" href="/css/base/chrome.css" />
    <link rel="stylesheet" href="/css/base/fields.css" />
    <link rel="stylesheet" href="/css/base/hero.css" />
    <!-- the four control modules were one controls.css; they load consecutively
         and in this order so the cascade is the one that file had. -->
    <link rel="stylesheet" href="/css/controls/primitives.css" />
    <link rel="stylesheet" href="/css/controls/combobox.css" />
    <link rel="stylesheet" href="/css/controls/combotip.css" />
    <link rel="stylesheet" href="/css/controls/sliders.css" />
    <link rel="stylesheet" href="/css/controls/ask.css" />
    <link rel="stylesheet" href="/css/cards/cards.css" />
    <link rel="stylesheet" href="/css/cards/packs.css" />
    <link rel="stylesheet" href="/css/base/pending-bar.css" />
    <link rel="stylesheet" href="/css/cards/narrowing.css" />
    <link rel="stylesheet" href="/css/cards/multiselect.css" />
    <link rel="stylesheet" href="/css/controls/knobs.css" />
    <link rel="stylesheet" href="/css/cards/plots.css" />
    <link rel="stylesheet" href="/css/base/aesthetic.css" />
    <link rel="stylesheet" href="/css/features/volume.css" />
    <link rel="stylesheet" href="/css/features/volume-panels.css" />
    <link rel="stylesheet" href="/css/features/matrix.css" />
    <link rel="stylesheet" href="/css/features/matrix-panels.css" />
    <link rel="stylesheet" href="/css/features/crossfeed.css" />
    <link rel="stylesheet" href="/css/features/speakers.css" />
    <link rel="stylesheet" href="/css/features/live.css" />
    <!-- typography.css is deliberately LAST: it owns the size + color of every
         text role and must win over the per-module declarations it replaced.
         This is the only module whose slot is "the end"; see its header. -->
    <link rel="stylesheet" href="/css/base/typography.css" />
    <!-- No-build ES modules. The importmap resolves every bare specifier to a
         vendored file so preact, its hooks, and signals all share ONE preact
         instance (required for signals' auto-subscribe). All local — CSP-clean. -->
    <script type="importmap">
      {
        "imports": {
          "preact": "/vendor/preact.module.js",
          "preact/hooks": "/vendor/hooks.module.js",
          "@preact/signals-core": "/vendor/signals-core.module.js",
          "@preact/signals": "/vendor/signals.module.js",
          "htm": "/vendor/htm.module.js"
        }
      }
    </script>
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
