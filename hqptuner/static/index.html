<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>HQPTuner</title>
    <!-- default slider glyph; store/ui/favicon.js swaps it per the active preset -->
    <link id="favicon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%9A%EF%B8%8F%3C/text%3E%3C/svg%3E" />
    <!-- The faceplate's stylesheets. This order is the cascade order: tokens, the frame and its
         primitives, then one sheet per region. -->
    <link rel="stylesheet" href="/css/v2/tokens.css" />
    <link rel="stylesheet" href="/css/v2/base.css" />
    <link rel="stylesheet" href="/css/v2/primitives.css" />
    <link rel="stylesheet" href="/css/v2/header.css" />
    <link rel="stylesheet" href="/css/v2/rail.css" />
    <link rel="stylesheet" href="/css/v2/page.css" />
    <link rel="stylesheet" href="/css/v2/popovers.css" />
    <link rel="stylesheet" href="/css/v2/drawer.css" />
    <link rel="stylesheet" href="/css/v2/meter.css" />
    <link rel="stylesheet" href="/css/v2/matrix.css" />
    <link rel="stylesheet" href="/css/v2/sheets.css" />
    <link rel="stylesheet" href="/css/v2/settings.css" />
    <link rel="stylesheet" href="/css/v2/switcher.css" />
    <link rel="stylesheet" href="/css/v2/builder.css" />
    <!-- No-build ES modules, resolved by one importmap so preact, its hooks and signals share one
         preact instance. -->
    <script type="importmap">
      {
        "imports": {
          "preact": "/vendor/preact.module.js",
          "preact/hooks": "/vendor/hooks.module.js",
          "@preact/signals-core": "/vendor/signals-core.module.js",
          "@preact/signals": "/vendor/signals.module.js",
          "htm": "/vendor/htm.module.js"
        }
      }
    </script>
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
